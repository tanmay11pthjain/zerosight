<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drop a folder into the 0</title>
<style>
  :root { --bg:#f3ede6; --ink:#1b1410; --orange:#ff6a13; --dim:#8a7a68; --card:#070504; --card-ink:#f6ede3; --card-dim:#a2927f;
          box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b0807; --ink:#f6ede3; --dim:#a2927f; } }
  :root[data-theme="dark"] { --bg:#0b0807; --ink:#f6ede3; --dim:#a2927f; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; }
  .zw { position:relative; width:min(94vw,720px); aspect-ratio:1/1.05; max-height:90vh; border-radius:28px; overflow:hidden; cursor:pointer; outline:none;
        background:radial-gradient(ellipse at 50% 42%, #150b05 0%, #0a0604 60%, #050302 100%);
        border:1px solid rgba(255,106,19,.12); transition:border-color .35s; user-select:none; -webkit-tap-highlight-color:transparent; }
  .zw:hover, .zw.zw-drag { border-color:rgba(255,106,19,.45); }
  .zw:focus-visible { box-shadow:0 0 0 2px var(--orange); }
  .zw canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .zw-label { position:absolute; left:0; right:0; bottom:4.5%; text-align:center; padding:0 20px; pointer-events:none; transition:opacity .24s ease; }
  .zw-title { font-size:clamp(18px,3.4vw,26px); font-weight:300; color:var(--card-ink); letter-spacing:.01em; }
  .zw-sub { color:var(--card-dim); font-size:14px; margin-top:6px; min-height:1.5em; }
  .zw input { display:none; }
</style>
</head>
<body>
<div id="zero"></div>

<script>
/* Zero wormhole: calm and still at rest (one clean 0 with a soft echo),
   all the motion (zoom, embers, light, shockwave) only while a folder travels. */
const ZeroWormhole = (() => {
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const ease = u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const K = reduced ? .25 : 1;
  const RATIO = 1.46, ROUND = 2.5, PTS = 120, SHRINK = .74, RINGS = 26, FRONT = 3;

  const UX = [], UY = [];
  for (let i = 0; i <= PTS; i++) {
    const th = -Math.PI / 2 + TAU * i / PTS, c = Math.cos(th), s = Math.sin(th);
    UX.push(Math.sign(c) * Math.pow(Math.abs(c), 2 / ROUND));
    UY.push(Math.sign(s) * Math.pow(Math.abs(s), 2 / ROUND) * RATIO);
  }

  function mount(root, opts = {}) {
    const o = Object.assign({
      title: "Drop a folder into the 0",
      hint: "Or click to choose one. It is encrypted on your device first.",
      onFiles() {}, onSwallowed() {}
    }, opts);

    root.classList.add("zw");
    root.tabIndex = 0;
    root.setAttribute("role", "button");
    root.setAttribute("aria-label", o.title);
    root.innerHTML = '<canvas></canvas><div class="zw-label"><div class="zw-title"></div><div class="zw-sub" aria-live="polite"></div></div><input type="file" multiple>';
    const cv = root.querySelector("canvas"), ctx = cv.getContext("2d");
    const titleEl = root.querySelector(".zw-title"), subEl = root.querySelector(".zw-sub");
    const input = root.querySelector("input"); input.webkitdirectory = true;

    let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R0 = 100;
    let z = 0, speed = 0, px = 0, py = 0, tx = 0, ty = 0, tm = 0;
    let inside = false, dragging = false, progress = null, prog = 0, pv = 0, closing = 0;
    let flash = 0, burst = 1, imp = null, chips = [], sparks = [], embers = [], raf = 0, last = 0;

    let tt = 0, pend = null;                     // text fades out, swaps, fades back in
    function setStatus(t, s) {
      s = s || "";
      const lab = titleEl.parentNode;
      if (!titleEl.textContent || titleEl.textContent === t) {
        if (!pend) { titleEl.textContent = t; subEl.textContent = s; } else pend = [t, s];
        return;
      }
      pend = [t, s]; lab.style.opacity = 0; clearTimeout(tt);
      tt = setTimeout(() => { titleEl.textContent = pend[0]; subEl.textContent = pend[1]; pend = null; lab.style.opacity = 1; }, 240);
    }
    setStatus(o.title, o.hint);

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = root.clientWidth; H = root.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cx = W / 2; cy = H * .42; R0 = Math.min(W * .27, H * .22);
    }
    const ro = new ResizeObserver(resize); ro.observe(root); resize();

    function update(dt) {
      tm += dt;
      let target = 0;
      if (dragging) target = .35;
      if (inside) target = 3.2;
      if (chips.some(c => !c.mode)) target = 3.2;
      speed += (target * K - speed) * Math.min(1, dt * (target * K > speed ? 2.4 : 1.2));
      if (target === 0 && speed < .01) speed = 0;
      z += speed * dt;
      if (target === 0 && speed === 0) {                 // settle on a whole ring: perfectly still
        const c = Math.ceil(z);
        if (c - z > 0) { z += (c - z) * Math.min(1, dt * 3); if (c - z < .002) z = c; }
      }
      px += (tx - px) * Math.min(1, dt * 5);
      py += (ty - py) * Math.min(1, dt * 5);
      flash = Math.max(0, flash - dt * 1.3);
      if (burst < 1) burst = Math.min(1, burst + dt / 1.2);
      if (progress !== null) { pv += ((progress - prog) * 38 - pv * 11) * dt; prog = clamp(prog + pv * dt); }
      if (closing > 0) { closing -= dt; if (closing <= 0) progress = null; }

      for (let i = chips.length - 1; i >= 0; i--) {
        const c = chips[i];
        if (c.delay > 0) { c.delay -= dt; continue; }
        if (c.mode === 2) { c.t += dt / 1.4; if (c.t >= 1) chips.splice(i, 1); continue; }
        if (c.mode === 1) continue;
        c.u += dt / c.dur;
        const p = chipPos(c, ease(clamp(c.u)));
        
        if (c.u < .95 && Math.random() < .6) sparks.push({ x: p[0] + (Math.random() - .5) * 16, y: p[1] + (Math.random() - .5) * 12, l: 1 });
        if (c.u >= 1) { c.u = 1; c.mode = 1; o.onSwallowed(c.item); }
      }
      
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += (cx - s.x) * dt * 3; s.y += (cy - s.y) * dt * 3; s.l -= dt * 1.5;
        if (s.l <= 0) sparks.splice(i, 1);
      }
      const open = clamp(speed / (K * 1.2)), want = Math.round(44 * open);   // embers exist only in transit
      while (embers.length < want) embers.push({ a: Math.random() * TAU, q: .05 + Math.random() * .25, v: .6 + Math.random() * .8, dead: false });
      for (const e of embers) {
        e.q *= 1 + dt * speed * e.v * .9;
        if (e.q > 2.6) { if (embers.length > want) e.dead = true; else { e.q = .04 + Math.random() * .06; e.a = Math.random() * TAU; } }
      }
      if (embers.some(e => e.dead)) embers = embers.filter(e => !e.dead);
    }

    function chipPos(c, e) {
      const dx = cx - c.x0, dy = cy - c.y0, len = Math.hypot(dx, dy) || 1, bow = Math.sin(Math.PI * e) * len * .18;
      const X = c.x0 + dx * e + (-dy / len) * bow, Y = c.y0 + dy * e + (dx / len) * bow;
      const th = 0, cs = Math.cos(th), sn = Math.sin(th), vx = X - cx, vy = Y - cy;
      return [cx + vx * cs - vy * sn, cy + vx * sn + vy * cs];
    }

    function trace(x, y, a, rot = 0) {
      const c = Math.cos(rot), s = Math.sin(rot);
      ctx.beginPath();
      for (let i = 0; i <= PTS; i++) { const u = UX[i] * a, v = UY[i] * a, X = x + u * c - v * s, Y = y + u * s + v * c; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
    }
    function pointAt(t, a) {
      const i = Math.min(PTS - 1, Math.floor(t)), f = t - i;
      return [cx + (UX[i] + (UX[i + 1] - UX[i]) * f) * a, cy + (UY[i] + (UY[i + 1] - UY[i]) * f) * a];
    }
    function arc(t0, t1, a) {
      ctx.beginPath(); let p = pointAt(t0, a); ctx.moveTo(p[0], p[1]);
      for (let i = Math.ceil(t0); i < t1; i++) { p = pointAt(i, a); ctx.lineTo(p[0], p[1]); }
      p = pointAt(t1, a); ctx.lineTo(p[0], p[1]);
    }
    function rr(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      const open = clamp(speed / (K * 1.2)), zf = z - Math.floor(z);

      /* soft light at the bottom of the tunnel (barely there at rest) */
      const fl = clamp(.05 + open * .7 + flash * .9), fr = R0 * (.14 + .55 * open + .35 * flash);
      ctx.save(); ctx.translate(cx, cy); ctx.scale(1, RATIO); ctx.globalCompositeOperation = "lighter";
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, fr);
      cg.addColorStop(0, "rgba(255,238,205," + fl + ")"); cg.addColorStop(.3, "rgba(255,140,40," + fl * .5 + ")"); cg.addColorStop(1, "rgba(255,106,19,0)");
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, fr, 0, TAU); ctx.fill(); ctx.restore();
      ctx.globalCompositeOperation = "source-over";

      /* nested zeros. At rest only the outer ring is strong and the echoes fade away. */
      const span = Math.max(.001, 2.4 * open), blur = Math.min(1, speed / (K * 2));
      for (let j = RINGS - 1; j >= 0; j--) {
        const k = j - FRONT - zf, s = Math.pow(SHRINK, k);
        let A = Math.pow(clamp(s), .35) * clamp(s / .02) * (1 - sstep(1.0005, 1.0005 + span, s));
        A *= open + (1 - open) * clamp(1 - k * .18);
        if (A < .01) continue;
        const deep = 1 - clamp(s), a = R0 * s, lw = .12 * a, rot = deep * .3 * open;
        const ph = k * .6 + tm * .4;
        const rx = cx - px * R0 * .12 * deep + Math.cos(ph) * R0 * .05 * open * deep;
        const ry = cy - py * R0 * .12 * deep + Math.sin(ph) * R0 * .05 * open * deep;

        if (blur > .12) for (let g = 2; g >= 1; g--) {
          const gs = s * Math.pow(SHRINK, .18 * g * blur);
          trace(rx, ry, R0 * gs, rot);
          ctx.strokeStyle = "rgba(255,110,25," + (.18 / g * A * blur) + ")"; ctx.lineWidth = .17 * R0 * gs; ctx.stroke();
        }
        trace(rx, ry, a, rot);
        ctx.strokeStyle = "rgba(255,106,19," + (.06 * A) + ")"; ctx.lineWidth = lw * 2.4; ctx.stroke();

        const mg = (106 - 62 * deep) | 0;
        const g = ctx.createLinearGradient(rx - a, ry - a * RATIO, rx + a, ry + a * RATIO);
        g.addColorStop(0, "rgba(255,196,120," + A + ")"); g.addColorStop(.42, "rgba(255," + mg + "," + ((19 + 8 * deep) | 0) + "," + A + ")"); g.addColorStop(1, "rgba(92,28,5," + A + ")");
        ctx.strokeStyle = g; ctx.lineWidth = lw; ctx.stroke();

        if (open > .05 && ctx.createConicGradient) {       // rotating highlight: transit only
          const sw = ctx.createConicGradient(tm * (1.1 + open * 2.5) + k * .55, rx, ry), Ao = A * open;
          sw.addColorStop(0, "rgba(255,244,205," + Ao + ")"); sw.addColorStop(.12, "rgba(255,230,170,0)");
          sw.addColorStop(.88, "rgba(255,230,170,0)"); sw.addColorStop(1, "rgba(255,244,205," + Ao + ")");
          trace(rx, ry, a * 1.08, rot); ctx.strokeStyle = sw; ctx.lineWidth = lw * .18; ctx.stroke();
        }
      }

      /* embers and sparks, transit only */
      ctx.globalCompositeOperation = "lighter";
      for (const e of embers) {
        const c = Math.cos(e.a), s = Math.sin(e.a);
        const ux = Math.sign(c) * Math.pow(Math.abs(c), 2 / ROUND), uy = Math.sign(s) * Math.pow(Math.abs(s), 2 / ROUND) * RATIO;
        const q0 = e.q / (1 + speed * .05), al = sstep(.05, .3, e.q) * (1 - sstep(1.6, 2.6, e.q));
        ctx.strokeStyle = "rgba(255,176,88," + al * .8 + ")"; ctx.lineWidth = .6 + 1.4 * e.q;
        ctx.beginPath(); ctx.moveTo(cx + ux * R0 * q0, cy + uy * R0 * q0); ctx.lineTo(cx + ux * R0 * e.q, cy + uy * R0 * e.q); ctx.stroke();
      }
      for (const s of sparks) {
        ctx.fillStyle = "rgba(255,150,50," + s.l * .9 + ")";
        ctx.beginPath(); ctx.arc(s.x, s.y, 1 + 2 * s.l, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      if (burst < 1) {
        trace(cx, cy, R0 * (1 + burst * 1.7));
        ctx.strokeStyle = "rgba(255,140,40," + (1 - burst) * .9 + ")"; ctx.lineWidth = 3 * (1 - burst) + .5; ctx.stroke();
      }
      if (imp !== null) {
        trace(cx, cy, R0 * (1.9 * (1 - imp * imp) + .05));
        ctx.strokeStyle = "rgba(255,236,200," + (.25 + .75 * imp) + ")"; ctx.lineWidth = 1 + 5 * imp; ctx.stroke();
      }

      /* progress: one thin ring with a bright head, no ticks */
      if (progress !== null) {
        const t = prog * PTS, ra = R0 * 1.22;
        trace(cx, cy, ra); ctx.strokeStyle = "rgba(255,106,19,.14)"; ctx.lineWidth = 2; ctx.stroke();
        if (t > .5) {
          arc(0, t, ra); ctx.strokeStyle = "#ff7a1c"; ctx.lineWidth = 3; ctx.stroke();
          const h = pointAt(t, ra), hg = ctx.createRadialGradient(h[0], h[1], 0, h[0], h[1], 14);
          hg.addColorStop(0, "rgba(255,250,235,1)"); hg.addColorStop(.3, "rgba(255,190,100,.7)"); hg.addColorStop(1, "rgba(255,106,19,0)");
          ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(h[0], h[1], 14, 0, TAU); ctx.fill();
          ctx.globalCompositeOperation = "source-over";
        }
      }

      /* the folder: a frosted-glass pocket with a tab, name and count */
      for (const c of chips) {
        if (c.delay > 0) continue;
        const e = ease(clamp(c.u)), p = chipPos(c, e), q = chipPos(c, Math.min(1, e + .012));
        const st = c.mode ? 1 : sstep(.3, .9, e), sc = c.mode === 2 ? c.sc * (1 - sstep(0, 1, c.t)) : c.mode === 1 ? .28 + .06 * Math.sin(tm * 1.6) : 1 - .66 * e; c.sc = sc;
        ctx.globalCompositeOperation = "lighter";
        ctx.globalCompositeOperation = "source-over";
        
        ctx.save(); ctx.translate(p[0], p[1]);
        ctx.scale(sc, sc);
        ctx.globalAlpha = c.mode === 2 ? 1 - sstep(.35, 1, c.t) : 1;
        const bg = ctx.createLinearGradient(0, -60, 0, 60);
        bg.addColorStop(0, "#ff9a4a"); bg.addColorStop(1, "#7a2a0a");
        ctx.fillStyle = bg; rr(-84, -62, 62, 22, 8); ctx.fill(); rr(-84, -50, 168, 110, 14); ctx.fill();   // back panel + tab
        rr(-84, -30, 168, 90, 14);                                                                          // frosted front
        const fg = ctx.createLinearGradient(0, -30, 0, 60);
        fg.addColorStop(0, "rgba(255,244,232,.34)"); fg.addColorStop(1, "rgba(255,236,220,.14)");
        ctx.fillStyle = fg; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.shadowColor = "#ff6a13"; ctx.shadowBlur = 14 * dpr; ctx.stroke(); ctx.shadowBlur = 0;
        if (st < .8) {
          ctx.globalAlpha *= 1 - st * 1.3; ctx.textBaseline = "alphabetic";
          ctx.fillStyle = "#fff"; ctx.font = "500 14px system-ui,sans-serif"; ctx.fillText(c.name, -70, 32);
          ctx.fillStyle = "rgba(255,255,255,.72)"; ctx.font = "10.5px ui-monospace,Menlo,monospace"; ctx.fillText(c.meta, -70, 48);
        }
        ctx.restore();
      }
      for (const c of chips) {                     // folder name stays readable under the folder
        if (c.delay > 0) continue;
        const e = ease(clamp(c.u)), a = c.mode === 2 ? 1 - sstep(0, .5, c.t) : c.mode === 1 ? 1 : sstep(.55, 1, e);
        if (a < .02) continue;
        const p = chipPos(c, e), y = p[1] + 60 * c.sc + 22;
        ctx.font = "500 14px system-ui,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const w = ctx.measureText(c.label).width + 26;
        ctx.globalAlpha = a * .8; ctx.fillStyle = "rgba(10,6,4,.75)"; rr(p[0] - w / 2, y - 14, w, 28, 14); ctx.fill();
        ctx.globalAlpha = a; ctx.fillStyle = "#f6ede3"; ctx.fillText(c.label, p[0], y);
        ctx.textAlign = "left";
      }
      ctx.globalAlpha = 1;
    }

    function frame(ts) {
      const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
      update(dt); draw(); raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);

    const short = n => (n.length > 16 ? n.slice(0, 9) + "…" + n.slice(-5) : n);
    const fmt = b => (b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(0) + " KB" : b < 1073741824 ? (b / 1048576).toFixed(1) + " MB" : (b / 1073741824).toFixed(1) + " GB");

    function swallow(items, pt) {
      const r = root.getBoundingClientRect();
      const x0 = pt ? clamp(pt.x - r.left, 0, W) : W / 2, y0 = pt ? clamp(pt.y - r.top, 0, H) : H * .84;
      inside = true; dragging = false; tx = 0; ty = 0; root.classList.remove("zw-drag");
      setStatus("Entering the 0", "");
      items.forEach((it, i) => chips.push({ item: it, name: short(it.name), meta: it.meta, trail: [], label: it.name.length > 28 ? it.name.slice(0, 25) + "…" : it.name, mode: 0, t: 0, sc: 1, x0, y0, u: 0, delay: i * .22, dur: reduced ? .3 : 1.6 }));
    }
    function handle(items, raw, pt) {
      if (!items.length) return;
      swallow(items, pt); o.onFiles(items, raw);
    }
    function groupFiles(files) {                       // chosen folder -> one card per top-level folder
      const m = new Map();
      for (const f of files) {
        const top = (f.webkitRelativePath || "").split("/")[0] || f.name;
        const g = m.get(top) || { name: top, count: 0, bytes: 0, folder: !!f.webkitRelativePath };
        g.count++; g.bytes += f.size; m.set(top, g);
      }
      return [...m.values()].map(g => ({ name: g.name, meta: g.folder ? g.count + (g.count === 1 ? " file · " : " files · ") + fmt(g.bytes) : fmt(g.bytes) }));
    }

    const on = (el, ev, fn) => el.addEventListener(ev, fn);
    on(root, "dragenter", e => { e.preventDefault(); dragging = true; root.classList.add("zw-drag"); });
    on(root, "dragover", e => {
      e.preventDefault(); dragging = true; const r = root.getBoundingClientRect();
      tx = clamp(((e.clientX - r.left) / r.width - .5) * 2, -1, 1); ty = clamp(((e.clientY - r.top) / r.height - .5) * 2, -1, 1);
    });
    on(root, "dragleave", e => { if (!root.contains(e.relatedTarget)) { dragging = false; root.classList.remove("zw-drag"); } });
    on(root, "drop", e => {
      e.preventDefault();
      const ents = Array.from(e.dataTransfer.items || []).map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
      const items = ents.length
        ? ents.map(en => ({ name: en.name, meta: en.isDirectory ? "Folder" : "File" }))
        : Array.from(e.dataTransfer.files).map(f => ({ name: f.name, meta: fmt(f.size) }));
      handle(items, ents.length ? ents : e.dataTransfer.files, { x: e.clientX, y: e.clientY });
    });
    on(root, "pointermove", e => {
      const r = root.getBoundingClientRect();
      tx = clamp(((e.clientX - r.left) / r.width - .5) * 2, -1, 1); ty = clamp(((e.clientY - r.top) / r.height - .5) * 2, -1, 1);
    });
    on(root, "pointerleave", () => { tx = 0; ty = 0; });
    on(root, "click", () => input.click());
    on(root, "keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    on(input, "click", e => e.stopPropagation());
    on(input, "change", () => { const f = Array.from(input.files); handle(groupFiles(f), f); input.value = ""; });

    return {
      swallow, setStatus,
      setProgress() {},
      complete(t, s) { inside = false; chips.forEach(c => { c.mode = 2; c.t = 0; }); setStatus(t || "Sent into the 0", s); },
      reset() { inside = false; progress = null; closing = 0; imp = null; chips = []; sparks = []; setStatus(o.title, o.hint); },
      destroy() { cancelAnimationFrame(raf); ro.disconnect(); root.innerHTML = ""; }
    };
  }
  return { mount };
})();

/* DEMO: replace simulate() with the real upload pipeline */
const wh = ZeroWormhole.mount(document.getElementById("zero"), {
  onFiles(items) { simulate(items[0]); }
});
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function simulate(item) {
  wh.setStatus("Falling into the 0", "Encrypting " + item.name + " on your device");
  await sleep(2200);
  let p = 0;
  while (p < 1) {
    p = Math.min(1, p + .02 + Math.random() * .03);
    wh.setProgress(p);
    wh.setStatus("Travelling through the 0", "Uploading ciphertext, " + Math.round(p * 100) + "%");
    await sleep(110);
  }
  wh.complete("Sent into the 0", "0 plaintext bytes left your device.");
  await sleep(6000);
  wh.reset();
}
